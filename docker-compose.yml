services:
  backend:
    image: '${STACK_NAME?Variable not set}-backend:${TAG?Variable not set}'
    restart: on-failure:5
    build:
      context: ./backend
    environment:
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-1}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
      TURING_ALLOWED_ORIGINS: https://${DOMAIN?Variable not set}
      TURING_ALLOW_ORIGINLESS_WEBSOCKETS: "true"
      TURING_ENABLE_DOCS: "false"
      TURING_MAX_COMPUTE_JOBS: ${TURING_MAX_COMPUTE_JOBS:-2}
      TURING_MAX_COMPUTE_WAITERS: ${TURING_MAX_COMPUTE_WAITERS:-2}
      TURING_COMPUTE_WORKERS: ${TURING_COMPUTE_WORKERS:-2}
      TURING_ADMISSION_TIMEOUT_SECONDS: ${TURING_ADMISSION_TIMEOUT_SECONDS:-0.25}
      TURING_IDLE_TIMEOUT_SECONDS: ${TURING_IDLE_TIMEOUT_SECONDS:-600}
      TURING_FRAME_RATE: ${TURING_FRAME_RATE:-10}
      TURING_STEPS_PER_FRAME: ${TURING_STEPS_PER_FRAME:-25}
      TURING_MAX_RENDER_SIMULATION_PIXELS: ${TURING_MAX_RENDER_SIMULATION_PIXELS:-1048576}
      TURING_MAX_RENDER_OUTPUT_EDGE: ${TURING_MAX_RENDER_OUTPUT_EDGE:-4096}
      TURING_BENCHMARK_ITERATIONS_PER_SECOND: ${TURING_BENCHMARK_ITERATIONS_PER_SECOND:-421.2}
      TURING_RENDER_DATA_DIR: /var/lib/turing
      TURING_MAX_RENDER_QUEUE: ${TURING_MAX_RENDER_QUEUE:-3}
      TURING_MAX_RENDER_JOBS_PER_CLIENT: ${TURING_MAX_RENDER_JOBS_PER_CLIENT:-2}
      TURING_RENDER_JOB_TIMEOUT_SECONDS: ${TURING_RENDER_JOB_TIMEOUT_SECONDS:-900}
      TURING_RENDER_ARTIFACT_TTL_SECONDS: ${TURING_RENDER_ARTIFACT_TTL_SECONDS:-86400}
      TURING_MAX_RENDER_ARTIFACTS: ${TURING_MAX_RENDER_ARTIFACTS:-8}
      TURING_MAX_RENDER_JOB_HISTORY: ${TURING_MAX_RENDER_JOB_HISTORY:-64}
      TURING_RENDER_CHUNK_STEPS: ${TURING_RENDER_CHUNK_STEPS:-100}
      TURING_LOG_LEVEL: ${TURING_LOG_LEVEL:-INFO}
    networks:
      - default
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    cpus: ${BACKEND_CPU_LIMIT:-4.0}
    mem_limit: ${BACKEND_MEMORY_LIMIT:-2g}
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    volumes:
      - render-data:/var/lib/turing
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: '${STACK_NAME?Variable not set}-frontend:${TAG?Variable not set}'
    restart: on-failure:5
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - traefik-public
      - default
    build:
      context: ./frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    cpus: ${FRONTEND_CPU_LIMIT:-0.5}
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-256m}
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-frontend.loadbalancer.server.port=8080

      - traefik.http.middlewares.${STACK_NAME?Variable not set}-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-https-redirect.redirectscheme.permanent=true
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-rate-limit.ratelimit.average=20
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-rate-limit.ratelimit.period=1s
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-rate-limit.ratelimit.burst=40
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-inflight.inflightreq.amount=50

      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.rule=Host(`${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.middlewares=${STACK_NAME?Variable not set}-https-redirect@docker

      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.rule=Host(`${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls.certresolver=le
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.middlewares=${STACK_NAME?Variable not set}-rate-limit@docker,${STACK_NAME?Variable not set}-inflight@docker

networks:
  traefik-public:
    name: traefik-public
    external: true
  default:
    driver: bridge

volumes:
  render-data:
