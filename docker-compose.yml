services:
  backend:
    build:
      context: ./backend
    networks:
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.constraint-label=traefik-public
      - traefik.http.routers.backend-http.rule=Host(`turing.duckdns.org`)
      - traefik.http.routers.backend-http.entrypoints=https
      - traefik.http.routers.backend-http.tls.certresolver=le
      - traefik.http.services.backend-http.loadbalancer.server.port=8000




  frontend:
    image: nginx:alpine
    restart: always
    volumes:
      # In production, freeze static website via Dockerfile.web and remove the bind mount
      - ./frontend/dist:/usr/share/nginx/html
    networks:
      - traefik-public
      - default
    build:
      context: ./frontend
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.turing-web.loadbalancer.server.port=80
      
      - traefik.http.routers.${STACK_NAME}-frontend-http.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.${STACK_NAME}-frontend-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME}-frontend-http.middlewares=https-redirect

      - traefik.http.routers.${STACK_NAME}-frontend-https.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.${STACK_NAME}-frontend-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME}-frontend-https.tls=true
      - traefik.http.routers.${STACK_NAME}-frontend-https.tls.certresolver=le
      - traefik.http.routers.${STACK_NAME}-frontend-https.middlewares=rate-limit

networks:
  default:
    external: true
    name: traefik_proxy
