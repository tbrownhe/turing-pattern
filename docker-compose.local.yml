services:

  backend:
    image: 'backend:${TAG:-latest}'
    restart: always
    build:
      context: ./backend
    ports:
      - "8000:8000"   # Expose FastAPI backend at http://localhost:8000

  frontend:
    image: nginx:alpine
    restart: always
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:80"     # Expose frontend at http://localhost:3000
    